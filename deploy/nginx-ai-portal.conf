# nginx site for ai-portal.si on the Hetzner server (add once DNS points here).
# The app runs in the "ai-portal" container on 127.0.0.1:3010 (.github/workflows/deploy.yml).
# Redirects for www and the other domains happen inside the app (next.config.ts),
# so every host just forwards with its original Host header.
#
# Certificates: sudo certbot --nginx -d ai-portal.si -d www.ai-portal.si \
#   -d si-portal.si -d www.si-portal.si \
#   -d superintelligenceobservatory.cloud -d www.superintelligenceobservatory.cloud

server {
    listen 80;
    listen [::]:80;
    server_name ai-portal.si www.ai-portal.si si-portal.si www.si-portal.si
                superintelligenceobservatory.cloud www.superintelligenceobservatory.cloud;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
