name: Content engine
# Daily: reads the feeds, picks at most 2 stories, drafts them with Claude and opens a "Drafts"
# pull request for the editor (engine/README.md). Nothing is published until the editor approves.
on:
  schedule:
    - cron: "0 4 * * *" # 06:00 in Italy (summer time)
  workflow_dispatch:
  pull_request:
    paths: ["engine/**", "scripts/engine/**", "scripts/lib/**", ".github/workflows/engine.yml"]

concurrency:
  group: content-engine
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # On a pull request that changes the engine, draft one story to prove the prompts and API
      # calls work. That draft stays on the runner; only the daily run opens a drafts PR.
      - name: Draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/engine/draft.mjs ${{ github.event_name == 'pull_request' && '--picks 1 --test' || '--picks 2' }} --out engine-drafts.md

      - name: Illustrate the new drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/engine/illustrate.mjs $(git ls-files --others --exclude-standard content/articles)

      - name: Open the drafts pull request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$(git status --porcelain content/articles)" ]; then
            echo "No new drafts today."
            exit 0
          fi
          DAY="$(TZ=Europe/Rome date '+%-d %B')"
          BRANCH="drafts/$(TZ=Europe/Rome date +%Y-%m-%d-%H%M)"
          git config user.name "AI-Portal content engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/articles public/illustrations engine/seen.json
          git commit -m "Drafts for $DAY"
          git push -u origin "$BRANCH"
          FILES=$(git diff --name-only HEAD~1 -- content)
          if URL=$(gh pr create --base main --head "$BRANCH" --title "Drafts for $DAY" --body-file engine-drafts.md); then
            node scripts/editor/notify.mjs "$URL" $FILES
          else
            echo "::warning::Drafts are on branch $BRANCH, but GitHub refused to open the pull request. In the repo, go to Settings > Actions > General > Workflow permissions and tick 'Allow GitHub Actions to create and approve pull requests'."
            node scripts/editor/notify.mjs "https://github.com/${{ github.repository }}/compare/main...$BRANCH" $FILES
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-reports
          path: engine-drafts.md
          if-no-files-found: ignore
