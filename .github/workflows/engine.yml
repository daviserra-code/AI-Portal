name: Content engine
# Step 1 of the content engine (engine/README.md): read the feeds and report which stories
# would be drafted. Writes nothing to the site and needs no secrets.
on:
  schedule:
    - cron: "0 4 * * *" # 06:00 in Italy (summer time)
  workflow_dispatch:
  pull_request:
    paths: ["engine/**", "scripts/engine/**", ".github/workflows/engine.yml"]

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/engine/dry-run.mjs --out engine-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: engine-report
          path: engine-report.md
